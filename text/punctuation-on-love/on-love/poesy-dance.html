    <p><b>Poesy dance</b></p>

            <p>I’ll say a line, <br>and you tell me what it makes you think of.<br> 
                <br>
                Then you’ll say a line<br> 
                and I’ll tell you what your line makes me think of.<br> 
                <br> 
                And we’ll do this till we’re dizzy<br> 
                until a love poem has been struck.
            </p>
