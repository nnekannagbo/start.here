    <p>I met my love in August.<br>
I knew from our first encounter —<br>
setting eyes on each other through coy smiles in passing —<br>
it wasn’t a love of dalliance,<br>
nor a love of mere amorous fancy.<br>
<br>
The inevitability of our love was certain<br>
from the moment our “hellos” shook hands.</p>
